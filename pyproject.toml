[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-roi"
version = "1.0.0"
description = "Return on investment of NBA player salaries, 2024-25 season"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
